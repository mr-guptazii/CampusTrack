workflows:
  ios-unsigned-sideload:
    name: CampusTrack iOS (unsigned, for AltStore sideloading)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        BUNDLE_ID: "com.campustrack.campustrack"
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get

      # BoringSSL-GRPC's podspec bakes a literal "-GCC_WARN_INHIBIT_ALL_WARNINGS"
      # token into OTHER_CFLAGS, which newer Clang misparses as an unsupported
      # standalone "-G" flag. The Podfile's post_install Ruby hook did NOT
      # remove it in practice (confirmed via verbose build log — the flag
      # showed up completely unchanged in the actual clang invocation), so
      # patch it directly in the generated .xcconfig files on disk instead,
      # which is what Clang actually reads. Flutter's own `pod install` call
      # inside `flutter build ios` will see Podfile.lock/Manifest.lock
      # already match and skip reinstalling, so this patch survives through
      # to the actual compile.
      - name: Install pods and patch BoringSSL-GRPC OTHER_CFLAGS
        script: |
          set -e
          cd ios
          pod install --repo-update
          cd ..
          grep -rl -- "-GCC_WARN_INHIBIT_ALL_WARNINGS" ios/Pods --include="*.xcconfig" | while read -r f; do
            echo "Patching $f"
            sed -i '' 's/-GCC_WARN_INHIBIT_ALL_WARNINGS//g' "$f"
          done
          echo "Remaining occurrences after patch (should be none):"
          grep -rl -- "-GCC_WARN_INHIBIT_ALL_WARNINGS" ios/Pods --include="*.xcconfig" || echo "none found"

      # No code signing here on purpose — AltStore/AltServer will sign the
      # .ipa itself with your personal (free) Apple ID at install time.
      - name: Build unsigned iOS app
        script: |
          set +e
          flutter build ios --release --no-codesign --verbose 2>&1 | tee build_verbose.log
          BUILD_EXIT=${PIPESTATUS[0]}
          # Surface the exact failing compiler invocation (with the bad -G
          # flag) so we can pinpoint its source instead of guessing again.
          grep -B5 -- "-G " build_verbose.log > g_flag_context.log
          grep -B5 "unsupported option" build_verbose.log >> g_flag_context.log
          exit $BUILD_EXIT

      # `flutter build ios --no-codesign` only produces Runner.app, not a
      # .ipa. Package it into the standard Payload/ zip structure AltStore
      # expects, without embedding any signature.
      - name: Package unsigned .ipa
        script: |
          set -e
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -r campustrack-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/campustrack-unsigned.ipa
      - g_flag_context.log
      - build_verbose.log
