name: campustrack
description: "CampusTrack - Smart Attendance Manager for College Students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0
  google_sign_in: ^6.2.1

  # Local storage / offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management & navigation
  provider: ^6.1.2
  go_router: ^13.2.0

  # UI / charts
  fl_chart: ^0.66.2

  # Utilities
  intl: ^0.19.0
  csv: ^6.0.0
  path_provider: ^2.1.2
  uuid: ^4.3.3
  connectivity_plus: ^7.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
